name: Python Package using Conda

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel concurrent runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.python-version }}
    if: github.repository == 'ARM-Development/RadTraQ'
    runs-on: ${{ matrix.os }}-latest
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        os: [macOS, ubuntu, Windows]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Conda Environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: ./continuous_integration/environment_actions.yml
          init-shell: >-
            bash
          cache-downloads: true
          post-cleanup: "all"
          create-args: python=${{ matrix.python-version }}

      - name: Fetch all history for all tags and branches
        run: |
          git fetch --prune --unshallow

      - name: Test with pytest
        run: |
          python -m pytest --mpl --cov=radtraq/
